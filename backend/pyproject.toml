[build-system]
requires = ["setuptools>=75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "edusign-webapp"
# To bump versions:
# * bump with tbump (updates this file, uv.lock and frontend/package.json)
# * create git tag and push
# * reference new tag in docker-edusign-app/backend/Dockerfile
# * reference new tag in docker-edusign-app/nginx/Dockerfile
version = "1.6.2b38"
description = "Backend for the eduSign web interface"
readme = "README.txt"
license = { text = "bsd" }
authors = [{ name = "SUNET" }]
urls = { Homepage = "https://github.com/SUNET/" }
classifiers = ["Programming Language :: Python"]
requires-python = ">=3.11"
dependencies = [
    "setuptools>=75.8.2",
    "Flask==3.1.3",
    "marshmallow==4.3.0",
    "Flask-Babel==4.0.0",
    "requests==2.34.2",
    "Flask-Mailman==1.1.1",
    "boto3==1.43.50",
    "flask-redis==0.4.0",
    "flask-cors==6.0.5",
    "flask-misaka==1.0.1",
    "reportlab==5.0.0",
    "pyHanko==0.35.2",
    "PyMuPDF==1.28.0",
    "pytz>=2025.1",
    "ocrmypdf==17.8.1",
    "PyYAML==6.0.3",
    "cryptography==49.0.0",
    "fakeredis==2.36.2",
    "signxml==5.1.0",
    "pygments==2.20.0",
    "chardet==7.4.3",
    "pdfminer.six==20260107",
    "psycopg2==2.9.12",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "coverage==7.15.2",
    "pytest-cov==7.1.0",
    "mock==5.2.0",
    "WebTest==3.0.7",
    "isort==8.0.1",
    "black==26.5.1",
    "mypy==2.3.0",
    "moto[s3]==5.2.2",
    "click==8.4.2",
    "charset_normalizer==3.4.9",
    "Jinja2==3.1.6",
    "idna==3.18",
    "cffi==2.1.0",
    "setuptools_rust==1.13.0",
    "certifi==2026.6.17",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "EDUSIGN", "FIRSTPARTY"]
