---
services:

  sp:
    build: .
    ports:
      - 80:80
    volumes:
      - edusignlogs:/var/log/edusign:rw
      - ../frontend/build:/opt/edusign/jsbuild:ro
      - ../../docker-edusign-app/example-customization:/opt/edusign/assets:ro
      # the example stylesheet paints the main area brown; serve an empty one
      - ./custom.css:/opt/edusign/assets/custom.css:ro
    environment:
      - "HOSTNAME=sp.edusign.docker"
    depends_on:
      - www

  www:
    build: ../backend/.
    expose:
      - 8080
    volumes:
      - edusignlogs:/var/log/edusign:rw
      - ../backend:/opt/edusign/edusign-webapp:ro
      - ../../docker-edusign-app/example-customization:/etc/edusign:ro
    environment:
      - "PYTHONPATH=/opt/edusign/edusign-webapp/src"
      - "HOSTNAME=sp.edusign.docker"
      - "SP_HOSTNAME=sp.edusign.docker"
      - "DEBUG=True"
      - "ENVIRONMENT=development"
      - "SESSION_COOKIE_SECURE=False"
      # plain HTTP: browsers drop a SameSite=None cookie without Secure
      - "SESSION_COOKIE_SAMESITE=Lax"
      - "PREFERRED_URL_SCHEME=http"
      - "EDUSIGN_API_PROFILE=edusign-test"
      - "MAIL_SUPPRESS_SEND=True"
      - "MAIL_BACKEND=dummy"
      - "APP_IN_TWO_PATHS=True"
      - "EDUSIGN_API_BASE_URL=http://fakeapi:8080/v1/"
      - "VALIDATOR_API_BASE_URL=http://fakeapi:8080/"
    depends_on:
      - fakeapi

  # Fake eduSign API and sign service, see fake-api/app.py.
  fakeapi:
    build: ./fake-api
    expose:
      - 8080
    environment:
      - "FAKE_SIGN_BASE_URL=http://sp.edusign.docker"

volumes:
  edusignlogs:
    name: edusignlogs
