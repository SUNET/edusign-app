
user www-data;
worker_processes  1;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    charset utf-8;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;
    client_max_body_size 20M;

    fastcgi_read_timeout 3000;
    proxy_read_timeout 3000;

    access_log /var/log/edusign/nginx-access.log;
    error_log /var/log/edusign/nginx-error.log crit;

    server {
      listen 80 default_server;
      server_name sp.edusign.docker;
      root /opt/edusign/frontend/public;

    # Fake login. These are the headers the Shibboleth SP would set, under
    # the names the backend reads (add_attributes_to_session in utils.py):
    # the eppn as plain text, the attributes below it as base64 of
    # <attr>value</attr>. One identity per path, so one browser can be
    # inviter on /sign and invitee on /sign2.
      location /sign {
        proxy_pass http://www:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect default;
        proxy_buffering off;
        proxy_set_header Edupersonprincipalname-20 pugoj-hutat@eduid.se;
        proxy_set_header Displayname-20 PGF0dHI+UXVpcXVlIFDDqXJlejwvYXR0cj4=;
        proxy_set_header Mail-20 PGF0dHI+ZXBlcmV6QGVtZXJneWEuY29tPC9hdHRyPg==;
        proxy_set_header Maillocaladdress-20 PGF0dHI+ZXBlcmV6KzFAZW1lcmd5YS5jb208L2F0dHI+;
        proxy_set_header Edupersonassurance-20 PGF0dHI+aHR0cDovL3d3dy5zd2FtaWQuc2UvcG9saWN5L2Fzc3VyYW5jZS9hbDE8L2F0dHI+;
        proxy_set_header Md-Organizationname eduID;
        proxy_set_header Md-Registrationauthority http://www.swamid.se/;
        proxy_set_header Shib-Authncontext-Class https://refeds.org/profile/mfa;
        proxy_set_header Shib-Authentication-Method authnmet;
        proxy_set_header Shib-Identity-Provider https://login.idp.eduid.se/idp.xml;
      }

      location /sign2 {
        proxy_pass http://www:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect default;
        proxy_buffering off;
        proxy_set_header Edupersonprincipalname-20 kujih-bakik@eduid.se;
        proxy_set_header Displayname-20 PGF0dHI+QWxiYSBQZXJlejwvYXR0cj4=;
        proxy_set_header Mail-20 PGF0dHI+ZXBlcmV6KzMzMkBlbWVyZ3lhLmNvbTwvYXR0cj4=;
        proxy_set_header Maillocaladdress-20 PGF0dHI+ZXBlcmV6KzJAZW1lcmd5YS5jb208L2F0dHI+;
        proxy_set_header Edupersonassurance-20 PGF0dHI+aHR0cDovL3d3dy5zd2FtaWQuc2UvcG9saWN5L2Fzc3VyYW5jZS9hbDE8L2F0dHI+;
        proxy_set_header Md-Organizationname eduID;
        proxy_set_header Md-Registrationauthority http://www.swamid.se/;
        proxy_set_header Shib-Authncontext-Class https://refeds.org/profile/mfa;
        proxy_set_header Shib-Authentication-Method authnmet;
        proxy_set_header Shib-Identity-Provider https://login.idp.eduid.se/idp.xml;
      }

      location /js {
          alias /opt/edusign/jsbuild;
      }

    # Logo, favicon and custom.css, from docker-edusign-app's
    # example-customization, mounted by the compose file.
      location /assets {
          alias /opt/edusign/assets;
      }

    # The fake sign service's user-facing step, see fake-api/app.py.
      location /fake-sign {
        proxy_pass http://fakeapi:8080;
        proxy_set_header Host $host;
      }

      location / {
        proxy_pass http://www:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect default;
        proxy_buffering off;
      }
    }
}
